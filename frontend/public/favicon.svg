<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="InventDB Legal">
  <!--
    InventDB Legal — the Counsel mark, solid cut, on no background, in the
    Chambers colourway.

    Derived from inventdb-legal-logo/favicon/favicon-transparent.svg; only the
    colours differ. With no tile behind it, one fixed colourway would vanish on
    half the tab strips there are — oxblood into a dark strip, the light pink
    into a pale one — so the mark carries both and takes whichever the tab
    strip calls for: oxblood with brass pans by day, rose with gilt pans by
    night.

    The solid cut, not the full one: below 20px the full cut's 5.5-unit pan
    outlines close up into a smudge. See the package README's two-cuts rule.
  -->
  <style>
    .ink { fill: #5b1a24; } /* oxblood */
    .pan { fill: #a8823a; } /* brass */
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6a7b0; } /* oxblood, by night */
      .pan { fill: #d9b871; } /* gilt */
    }
  </style>
  <!-- The glyph's ink spans y 12–120, so it sits 2 units high in the box. -->
  <g transform="translate(0 -2)">
    <circle class="ink" cx="64" cy="27" r="15"></circle>
    <path class="ink" d="M53 38 L75 38 L64 120 Z"></path>
    <path class="ink" d="M64 46 L16 30 L16 44 L64 62 Z"></path>
    <path class="ink" d="M64 46 L112 30 L112 44 L64 62 Z"></path>
    <path class="pan" d="M16 32 L2 76 L30 76 Z"></path>
    <path class="pan" d="M112 32 L98 76 L126 76 Z"></path>
  </g>
</svg>
