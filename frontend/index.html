<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#48176a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201e21" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="InventDB Legal — a modern legal practice management system for law firms: matters, time, billing, trust accounting and the deadline docket."
    />

    <!-- Brand mark: the "Counsel" balance, from inventdb-legal-logo/. The tab
         icon is the solid cut — the full cut's pan outlines close up below
         20px — drawn on nothing, so it sits in the tab strip rather than on a
         plum chip. With no tile behind it the mark has to survive both a white
         and a near-black tab strip, so favicon.svg carries the package's light
         and dark colourways and switches on prefers-color-scheme.

         The PNGs are the fallback for browsers with no SVG-favicon support,
         which predate that switch and so take the light colourway. The
         apple-touch icon keeps its plum tile on purpose: iOS composites a home
         screen icon over whatever wallpaper is there, and a transparent one
         would come out matted on black. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Poppins — the InventDB brand typeface.
         300 captions · 400 body · 500 subheads · 600/700 headings.
         Cormorant Garamond carries the wordmark only — 500 for "InventDB",
         700 for "Legal"; nothing else in the app is serif. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>InventDB Legal</title>

    <!-- Paint the stored theme before first render so dark users never see a
         white flash. ThemeContext reads whatever this leaves on <html>. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("legal.theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
